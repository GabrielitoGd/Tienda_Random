<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Random</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --dark-color: #2d3436;
            --light-color: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-color);
            color: var(--dark-color);
        }

        header {
            background-color: var(--dark-color);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .cart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .cart-btn:hover {
            background-color: #ff5252;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #e0e0e0;
        }

        .product-card h3 {
            margin: 0.8rem 0 0.4rem 0;
            font-size: 1.1rem;
        }

        .product-price {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .product-actions input {
            width: 50px;
            padding: 0.4rem;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .product-actions button {
            flex: 1;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .product-actions button:hover {
            background-color: #45b7af;
        }

        .cart-section {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .cart-section h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 0.5rem;
            font-size: 1.4rem;
        }

        .cart-items {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid #f1f1f1;
            font-size: 0.95rem;
        }

        .cart-item-details {
            display: flex;
            flex-direction: column;
        }

        .cart-item-details span:last-child {
            font-size: 0.8rem;
            color: #777;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            border-top: 2px solid #eee;
            padding-top: 1rem;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            background-color: #25d366; /* Color verde característico de WhatsApp */
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 1rem;
            transition: background 0.3s;
        }

        .checkout-btn:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tienda Random 🎲</h1>
        <button class="cart-btn" onclick="document.querySelector('.cart-section').scrollIntoView({behavior: 'smooth'})">🛒 Ver Canasta</button>
    </header>

    <div class="container">
        <!-- Listado de Productos -->
        <div class="products-grid">
            <!-- Producto 1 -->
            <div class="product-card">
                <img src="https://picsum.photos/seed/prod1/200/150" alt="Taza Mágica">
                <div>
                    <h3>Taza Mágica</h3>
                    <div class="product-price">Gs. 45.000</div>
                </div>
                <div class="product-actions">
                    <input type="number" id="qty-1" value="1" min="1" max="99">
                    <button onclick="agregarAlCarrito('Taza Mágica', 45000, 'qty-1')">Agregar</button>
                </div>
            </div>

            <!-- Producto 2 -->
            <div class="product-card">
                <img src="https://picsum.photos/seed/prod2/200/150" alt="Gorra Retro">
                <div>
                    <h3>Gorra Retro</h3>
                    <div class="product-price">Gs. 60.000</div>
                </div>
                <div class="product-actions">
                    <input type="number" id="qty-2" value="1" min="1" max="99">
                    <button onclick="agregarAlCarrito('Gorra Retro', 60000, 'qty-2')">Agregar</button>
                </div>
            </div>

            <!-- Producto 3 -->
            <div class="product-card">
                <img src="https://picsum.photos/seed/prod3/200/150" alt="Stickers Pack">
                <div>
                    <h3>Pack de Stickers</h3>
                    <div class="product-price">Gs. 15.000</div>
                </div>
                <div class="product-actions">
                    <input type="number" id="qty-3" value="1" min="1" max="99">
                    <button onclick="agregarAlCarrito('Pack de Stickers', 15000, 'qty-3')">Agregar</button>
                </div>
            </div>

            <!-- Producto 4 -->
            <div class="product-card">
                <img src="https://picsum.photos/seed/prod4/200/150" alt="Llavero LED">
                <div>
                    <h3>Llavero LED</h3>
                    <div class="product-price">Gs. 25.000</div>
                </div>
                <div class="product-actions">
                    <input type="number" id="qty-4" value="1" min="1" max="99">
                    <button onclick="agregarAlCarrito('Llavero LED', 25000, 'qty-4')">Agregar</button>
                </div>
            </div>
        </div>

        <!-- Canasta / Carrito -->
        <div class="cart-section">
            <h2>Canasta de Compras</h2>
            <ul id="cart-items" class="cart-items">
                <li style="color: #888; text-align: center; padding: 1rem 0;">Tu canasta está vacía</li>
            </ul>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">Gs. 0</span>
            </div>
            <button class="checkout-btn" onclick="enviarPedidoWhatsApp()">📲 Enviar Pedido por WhatsApp</button>
        </div>
    </div>

    <script>
        let carrito = [];

        function agregarAlCarrito(nombre, precio, inputId) {
            const cantidadInput = document.getElementById(inputId);
            const cantidad = parseInt(cantidadInput.value);

            if (isNaN(cantidad) || cantidad <= 0) {
                alert("Por favor ingresa una cantidad válida.");
                return;
            }

            const index = carrito.findIndex(item => item.nombre === nombre);
            if (index !== -1) {
                carrito[index].cantidad += cantidad;
            } else {
                carrito.push({ nombre, precio, cantidad });
            }

            actualizarCarrito();
            cantidadInput.value = 1;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const listaItems = document.getElementById('cart-items');
            const totalPrecioEl = document.getElementById('cart-total-price');
            
            listaItems.innerHTML = '';

            if (carrito.length === 0) {
                listaItems.innerHTML = '<li style="color: #888; text-align: center; padding: 1rem 0;">Tu canasta está vacía</li>';
                totalPrecioEl.textContent = 'Gs. 0';
                return;
            }

            let total = 0;
            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div class="cart-item-details">
                        <span><strong>${item.nombre}</strong> (x${item.cantidad})</span>
                        <span>Gs. ${subtotal.toLocaleString()}</span>
                    </div>
                    <button class="remove-btn" onclick="eliminarDelCarrito(${index})">✕</button>
                `;
                listaItems.appendChild(li);
            });

            totalPrecioEl.textContent = `Gs. ${total.toLocaleString()}`;
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("La canasta está vacía. Selecciona al menos un producto.");
                return;
            }

            // Construir el texto del mensaje
            let mensaje = "¡Hola! Quiero hacer el siguiente pedido:\n\n";
            let total = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `▪️ ${item.cantidad}x ${item.nombre} - Gs. ${subtotal.toLocaleString()}\n`;
            });

            mensaje += `\n*Total a pagar: Gs. ${total.toLocaleString()}*`;

            // Codificar el texto para URL
            let mensajeCodificado = encodeURIComponent(mensaje);

            // URL base de WhatsApp provista
            let urlWhatsApp = `https://wa.me/595984312950?text=${mensajeCodificado}`;

            // Abrir enlace en una pestaña nueva o en el WebViewer
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
